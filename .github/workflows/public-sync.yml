name: One-time sanitized public sync

on:
  push:
    paths:
      - '.github/workflows/public-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone source repository
        run: git clone --depth 1 https://github.com/kenzoIS/bayanihub.git /tmp/source
      - name: Copy runnable project
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='.builder/' \
            --exclude='.env' --exclude='.env.*' --exclude='**/.env' --exclude='**/.env.*' \
            --exclude='.env.example' --exclude='**/.env.example' \
            --exclude='*.md' --exclude='**/*.md' \
            --exclude='*.log' --exclude='**/*.log' \
            --exclude='node_modules/' --exclude='**/node_modules/' \
            --exclude='dist/' --exclude='**/dist/' \
            --exclude='build/' --exclude='**/build/' \
            --exclude='coverage/' --exclude='**/coverage/' \
            --exclude='.next/' --exclude='**/.next/' \
            --exclude='*.tsbuildinfo' --exclude='**/*.tsbuildinfo' \
            --exclude='*.spec.ts' --exclude='**/*.spec.ts' \
            --exclude='*.spec.tsx' --exclude='**/*.spec.tsx' \
            --exclude='*.test.ts' --exclude='**/*.test.ts' \
            --exclude='*.test.tsx' --exclude='**/*.test.tsx' \
            --exclude='*.test.js' --exclude='**/*.test.js' \
            --exclude='*.test.jsx' --exclude='**/*.test.jsx' \
            --exclude='test/' --exclude='**/test/' \
            --exclude='tests/' --exclude='**/tests/' \
            --exclude='__tests__/' --exclude='**/__tests__/' \
            /tmp/source/ ./
      - name: Verify env files and secrets
        shell: bash
        run: |
          BAD_ENV=$(find . -type f \( -name '.env' -o -name '.env.*' \) ! -name '.env.example' ! -path './.git/*' -print)
          [ -z "$BAD_ENV" ] || { echo "$BAD_ENV"; exit 1; }
          PATTERN='gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|mongodb(\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@|postgres(ql)?://[^[:space:]/:]+:[^[:space:]@]+@'
          if grep -RInIE "$PATTERN" . --exclude-dir=.git --exclude='*.lock'; then
            echo 'Potential credential detected. Sync aborted.'
            exit 1
          fi
      - name: Commit sanitized runnable copy
        shell: bash
        run: |
          git config user.name 'kenzoIS-public-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync complete sanitized runnable source'
          git push
